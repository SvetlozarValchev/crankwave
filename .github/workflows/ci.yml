name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDER_BASE_IMAGE: debian:bookworm-slim@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241
  NODE_BASE_IMAGE: node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
  BUILDER_IMAGE: engine-sim-offline-native-builder:ci

jobs:
  release-gate:
    name: Native tests and native-only distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact source and LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '$1 == "VERSION" { print $2; exit }' CMakeLists.txt)
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify source assets and simulator-free playback modules
        shell: bash
        run: |
          set -euo pipefail
          git lfs fsck
          node tools/ir-authoring-catalog/generate.mjs --check
          node tools/ir-authoring-catalog/test.mjs
          node --test \
            web/tests/runtime/partitioned-spectrum-convolver.test.mjs \
            web/tests/runtime/renderer-runtime-compatibility.test.mjs \
            web/tests/runtime/responsive-audio-lifecycle-runtime.test.mjs \
            web/tests/runtime/revengine-audio-engine.test.mjs \
            web/tests/runtime/revengine-package.test.mjs \
            web/tests/runtime/shared-recorded-starter-runtime.test.mjs

      - name: Verify development-only WASM parity oracle
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-wasm-parity.sh

      - name: Assemble pinned native build environment
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${BUILDER_BASE_IMAGE}"
          docker pull "${NODE_BASE_IMAGE}"
          docker build \
            --build-arg "BUILDER_BASE_IMAGE=${BUILDER_BASE_IMAGE}" \
            --build-arg "NODE_BASE_IMAGE=${NODE_BASE_IMAGE}" \
            --file scripts/ci/native-builder.Dockerfile \
            --tag "${BUILDER_IMAGE}" \
            scripts/ci

      - name: Build and test native release
        env:
          ESO_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --pids-limit 4096 \
            -e ESO_VERSION \
            -e ESO_BUILD_ROOT=.work/github-ci \
            -e ESO_JOBS=4 \
            -e GITHUB_SHA \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            "${BUILDER_IMAGE}" \
            ./scripts/ci/build-release.sh

      - name: Verify emitted distribution from the host boundary
        env:
          ESO_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          archive=".work/github-ci/native/distribution/Release/engine-sim-offline-${ESO_VERSION}.tar"
          sidecar="${archive}.sha256"
          extracted=".work/github-ci/host-verification"
          rm -rf "${extracted}"
          mkdir -p "${extracted}"
          tar -xf "${archive}" -C "${extracted}" --no-same-owner --no-same-permissions
          node scripts/ci/verify-release.mjs \
            --archive "${archive}" \
            --sidecar "${sidecar}" \
            --prefix "${extracted}/engine-sim-offline-${ESO_VERSION}" \
            --release "${ESO_VERSION}" \
            --revision "${GITHUB_SHA}"
